name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      VERSION_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_release.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      - run: cargo package --workspace --exclude tesela-py --no-verify

  wheels:
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: .
          manylinux: "2_28"
          args: --release --locked --compatibility pypi --out dist -i ${{ matrix.os == 'ubuntu-latest' && format('python{0}', matrix.python-version) || 'python' }}
      - name: Install wheel and test
        shell: bash
        run: |
          python -m pip install pytest dist/*.whl
          python -m pytest python/tests/ -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  sdist:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: .
          args: --out dist
      - name: Install source distribution and test
        run: |
          python -m pip install pytest dist/*.tar.gz
          python -m pytest python/tests/ -q
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  crates:
    needs: [preflight, wheels, sdist]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        run: |
          if test -z "$CARGO_REGISTRY_TOKEN"; then
            echo '::error::Configure the CARGO_REGISTRY_TOKEN secret before releasing'
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          for package in tesela-core tesela-ir tesela-backend tesela-capability tesela-runtime tesela-macros; do
            cargo publish -p "$package" --locked
            for attempt in {1..20}; do
              if cargo info --registry crates-io "$package@$version" >/dev/null 2>&1; then
                break
              fi
              if test "$attempt" -eq 20; then
                echo "::error::$package $version was published but is not indexed yet"
                exit 1
              fi
              sleep 15
            done
          done
          cargo publish -p tesela --locked

  pypi:
    needs: [crates, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: sha256sum dist/* > manifest.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            manifest.sha256
          generate_release_notes: true
