[workspace]
members = [
    "crates/tesela-core",
    "crates/tesela-ir",
    "crates/tesela-backend",
    "crates/tesela-capability",
    "crates/tesela-runtime",
    "crates/tesela-macros",
    "crates/tesela",
    "crates/tesela-py",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Miguel Cárdenas"]
repository = "https://github.com/miguelcsx/tesela"
keywords = ["ontology", "runtime", "semantics", "capabilities"]
categories = ["data-structures"]
readme = "README.md"

[workspace.dependencies]
tesela-core = { path = "crates/tesela-core", version = "0.2.0" }
tesela-ir = { path = "crates/tesela-ir", version = "0.2.0" }
tesela-backend = { path = "crates/tesela-backend", version = "0.2.0" }
tesela-capability = { path = "crates/tesela-capability", version = "0.2.0" }
tesela-runtime = { path = "crates/tesela-runtime", version = "0.2.0" }
tesela-macros = { path = "crates/tesela-macros", version = "0.2.0" }
tesela = { path = "crates/tesela", version = "0.2.0" }

serde = { version = "1", features = ["derive", "rc"] }
arc-swap = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
pyo3 = "0.29"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
