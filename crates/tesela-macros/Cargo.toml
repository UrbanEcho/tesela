[package]
name = "tesela-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Procedural macros for declarative Tesela ontology definitions."

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"

[dev-dependencies]
tesela-core = { workspace = true }
tesela-ir = { workspace = true }
serde_json = { workspace = true }
