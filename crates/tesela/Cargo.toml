[package]
name = "tesela"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Embedded semantic capability runtime with host-owned backends and policy."

[dependencies]
tesela-core = { workspace = true }
tesela-ir = { workspace = true }
tesela-backend = { workspace = true }
tesela-runtime = { workspace = true }
tesela-capability = { workspace = true, optional = true }
tesela-macros = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { workspace = true }

[features]
default = ["macros", "dev"]
macros = ["dep:tesela-macros"]
capability = ["dep:tesela-capability"]
dev = ["tesela-backend/dev"]

[dev-dependencies]
serde_json = { workspace = true }
